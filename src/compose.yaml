name: bird-eshop

services:
  bird-eshop-db:
    image: postgres
  
  distributedcache:
    image: redis
  
  seq:
    image: datalust/seq:latest
    
  messagebus:
    image: rabbitmq:management
    
  identity:
    image: quay.io/keycloak/keycloak:24.0.3
    depends_on:
      - bird-eshop-db

volumes:
  postgres_bird-eshop-db: